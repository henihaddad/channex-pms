<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Channex PMS. The property management system for people who manage properties for other people.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#101a33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="1280" height="320" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="320" rx="24" fill="url(#grid)"/>
  <!-- calendar-ish mark -->
  <g transform="translate(88 96)">
    <rect x="0" y="0" width="128" height="128" rx="24" fill="#111a30" stroke="url(#accent)" stroke-width="3"/>
    <g fill="url(#accent)">
      <rect x="22" y="30" width="22" height="22" rx="5"/>
      <rect x="53" y="30" width="22" height="22" rx="5"/>
      <rect x="84" y="30" width="22" height="22" rx="5"/>
      <rect x="22" y="61" width="22" height="22" rx="5" opacity="0.35"/>
      <rect x="53" y="61" width="53" height="22" rx="5"/>
      <rect x="22" y="92" width="53" height="22" rx="5"/>
      <rect x="84" y="92" width="22" height="22" rx="5" opacity="0.35"/>
    </g>
  </g>
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" fill="#f8fafc">
    <text x="256" y="128" font-size="60" font-weight="800" letter-spacing="-1.5">Channex PMS</text>
    <text x="258" y="176" font-size="24" font-weight="500" fill="#cbd5e1">Property management and channel manager for people who manage properties for other people.</text>
    <g font-size="17" font-weight="600" fill="#0b1020">
      <rect x="258" y="206" width="112" height="34" rx="17" fill="url(#accent)"/>
      <text x="314" y="229" text-anchor="middle">fair-code</text>
      <rect x="382" y="206" width="132" height="34" rx="17" fill="#1f2a48"/>
      <text x="448" y="229" text-anchor="middle" fill="#e2e8f0">self-hostable</text>
      <rect x="526" y="206" width="176" height="34" rx="17" fill="#1f2a48"/>
      <text x="614" y="229" text-anchor="middle" fill="#e2e8f0">built on Channex.io</text>
    </g>
  </g>
</svg>
