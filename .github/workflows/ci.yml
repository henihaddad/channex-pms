name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  check:
    name: Lint, typecheck, unit, checks, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm check
      - run: node scripts/check-pii-logs.mjs

  integration:
    name: Integration (Postgres 16, Redis 7)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pms
          POSTGRES_PASSWORD: pms
          POSTGRES_DB: pms
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pms" --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://pms:pms@localhost:5432/pms
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=@pms/core --filter=@pms/authz --filter=@pms/db --filter=@pms/runtime
      - name: Migrate from scratch
        run: pnpm --filter @pms/db db:migrate
      - run: pnpm test:integration

  e2e:
    name: End to end (Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pms
          POSTGRES_PASSWORD: pms
          POSTGRES_DB: pms
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pms" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://pms:pms@localhost:5432/pms
      PMS_ENV: test
      PMS_TEST_HOOKS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=@pms/web
      - run: pnpm --filter @pms/db db:migrate
      - run: pnpm --filter @pms/web exec playwright install --with-deps chromium
      - run: pnpm --filter @pms/web test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/test-results
