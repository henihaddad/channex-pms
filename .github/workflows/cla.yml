name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: "signatures/cla.json"
          path-to-document: "https://github.com/henihaddad/channex-pms/blob/main/CONTRIBUTOR_LICENSE_AGREEMENT.md"
          branch: "cla-signatures"
          allowlist: henihaddad,dependabot[bot]
          custom-notsigned-prcomment: "Thank you for the contribution. Before we can merge, please sign the [Contributor License Agreement](https://github.com/henihaddad/channex-pms/blob/main/CONTRIBUTOR_LICENSE_AGREEMENT.md) by commenting the sentence below. It is four sentences long and you only sign it once."
